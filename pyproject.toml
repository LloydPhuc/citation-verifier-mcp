[project]
name = "citation-verifier-mcp"
version = "0.1.0"
description = "Local-first MCP server for bibliography and claim-to-source citation verification."
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Citation Verifier Contributors", email = "noreply@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
keywords = [
    "citation",
    "verification",
    "mcp",
    "bibliography",
    "nli",
    "fact-checking",
]
dependencies = [
    "mcp==2.2.0",
    "pdfplumber==0.11.10",
    "rank-bm25==0.2.2",
    "requests==2.34.2",
    "torch==2.14.0+cpu",
    "transformers==5.17.0",
    "sentencepiece==0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "ruff==0.9.3",
    "mypy==1.15.0",
    "reportlab==4.2.5",
    "pypdf==6.19.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring multiple components",
    "network: tests requiring network access",
    "docker: tests requiring Docker/GROBID",
    "slow: tests taking >10 seconds",
    "regression: regression tests for known behaviors",
]
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "B008",  # do not perform function calls in argument defaults
    "C408",  # do not use comprehensions for side effects
]
per-file-ignores = { }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true
namespace_packages = true
exclude = [
    "legacy",
    ".venv",
    "__pycache__",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["citation_v2*"]
exclude = ["legacy*", "tests*"]
