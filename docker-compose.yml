services:
  grobid:
    image: grobid/grobid:0.9.1-crf
    container_name: citation-verifier-grobid
    ports:
      - "127.0.0.1:${GROBID_HOST_PORT:-8070}:8070"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/api/isalive"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s