  <text x="40" y="94" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="700" fill="#f8fafc">RefSentry</text>
  <text x="40" y="128" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#e0e7ff">Citation Verifier MCP · Trace the citation. Inspect the evidence.</text>
